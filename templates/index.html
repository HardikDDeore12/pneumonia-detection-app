<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pneumonia Detection Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0 p-4">
                    <h2 class="text-center mb-2 fw-bold text-primary">Chest X-Ray Pneumonia Analyzer</h2>
                    <p class="text-center text-muted mb-4">Upload a chest radiograph to run deep learning inference, generate Grad-CAM heatmaps, and export clinical reports.</p>
                    
                    <form method="POST" enctype="multipart/form-data" class="mb-4">
                        <div class="input-group mb-3">
                            <input type="file" class="form-control" id="file" name="file" accept="image/*" required>
                            <button class="btn btn-primary px-4" type="submit">Analyze Scan</button>
                        </div>
                    </form>

                    {% if result %}
                    <hr class="my-4">
                    <div class="row text-center">
                        <div class="col-md-6 mb-3">
                            <h5 class="text-secondary">Original X-Ray</h5>
                            <img src="{{ image_path }}" class="img-fluid rounded border shadow-sm" style="max-height: 250px;" alt="Original X-Ray">
                        </div>
                        <div class="col-md-6 mb-3">
                            <h5 class="text-secondary">Grad-CAM Heatmap</h5>
                            <img src="{{ heatmap_path }}" class="img-fluid rounded border shadow-sm" style="max-height: 250px;" alt="Grad-CAM Heatmap">
                        </div>
                    </div>

                    <div class="alert {% if 'Pneumonia' in result %}alert-danger{% else %}alert-success{% endif %} text-center mt-3 p-3">
                        <h3 class="alert-heading fw-bold mb-1">{{ result }}</h3>
                        <p class="mb-2">Confidence Score: <strong>{{ confidence }}%</strong></p>
                        <hr>
                        <a href="{{ pdf_download }}" class="btn btn-dark btn-sm px-4">Download Clinical PDF Report</a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
